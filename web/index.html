<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by `flutter build web --base-href /sub/path/` when hosting under a sub path. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Denizhan Toprak: C++ gameplay programmer. Unreal Engine plugins, documentation and devlogs.">
  <meta name="theme-color" content="#0E0E11">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Elmarath · Unreal Engine tools & devlog">
  <meta property="og:description" content="Unreal Engine plugins, documentation and devlogs by Denizhan Toprak.">
  <meta property="og:image" content="assets/assets/images/hero.jpeg">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Elmarath">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Elmarath · Unreal Engine tools & devlog</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #0E0E11; }
    #splash {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #0E0E11; transition: opacity 300ms ease-out;
    }
    #splash img { width: 72px; height: 72px; animation: pulse 1.4s ease-in-out infinite; }
    #splash.hidden { opacity: 0; pointer-events: none; }
    @keyframes pulse { 0%, 100% { opacity: .35; transform: scale(.96); } 50% { opacity: 1; transform: scale(1); } }
  </style>
</head>
<body>
  <div id="splash"><img src="favicon.png" alt="Loading"></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('hidden');
      setTimeout(function () { splash.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
