<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by `flutter build web --base-href /sub/path/` when hosting under a sub path. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Denizhan Toprak: C++ gameplay programmer. Unreal Engine plugins, documentation and devlogs.">
  <meta name="theme-color" content="#0E0E11">

  <!-- Link previews (Discord, LinkedIn, Slack...). These need absolute URLs.
       twitter:card is the standard tag that asks for the large image; Discord reads it too. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Elmarath">
  <meta property="og:url" content="https://elmarath.com/">
  <meta property="og:title" content="Elmarath · Unreal Engine tools & devlog">
  <meta property="og:description" content="Unreal Engine plugins, documentation and devlogs by Denizhan Toprak.">
  <meta property="og:image" content="https://elmarath.com/assets/assets/images/hero.jpeg">
  <meta name="twitter:card" content="summary_large_image">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Elmarath">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Elmarath · Unreal Engine tools & devlog</title>

  <!-- Google Analytics, the same property as the previous site. Page changes are
       counted automatically (GA4 enhanced measurement). Skipped on localhost.
       Delete this block to turn analytics off. -->
  <script>
    (function () {
      var id = 'G-CRZ373MY93';
      if (/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) return;
      var script = document.createElement('script');
      script.async = true;
      script.src = 'https://www.googletagmanager.com/gtag/js?id=' + id;
      document.head.appendChild(script);
      window.dataLayer = window.dataLayer || [];
      window.gtag = function () { dataLayer.push(arguments); };
      gtag('js', new Date());
      gtag('config', id);
    })();
  </script>
  <link rel="manifest" href="manifest.json">

  <!-- Start everything the first frame waits for at once. Otherwise each step
       waits for the one before: main.dart.js has to load and start before it
       asks for the asset lists, the fonts and the renderer. -->
  <link rel="preload" href="main.dart.js" as="script">
  <link rel="preload" href="assets/FontManifest.json" as="fetch" crossorigin>
  <link rel="preload" href="assets/AssetManifest.bin.json" as="fetch" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <!-- The Inter and JetBrains Mono files AppTheme.preloadFonts gets from Google
       Fonts. test/content_test.dart fails if this list stops matching them
       (after upgrading google_fonts, say) and prints the right one. -->
  <link rel="preload" href="https://fonts.gstatic.com/s/a/06fb8b97ad04af6b7fa9f2fb17d3763d28f6694f777f33dcf147e84c55a4e81a.ttf" as="fetch" crossorigin>
  <link rel="preload" href="https://fonts.gstatic.com/s/a/7485a755eabadd6c1b38664e848793fd919674ab8d09c25e9347e93bea9a7177.ttf" as="fetch" crossorigin>
  <link rel="preload" href="https://fonts.gstatic.com/s/a/b7e339223d56e8c4210c86f1ba87b3d43d6c47e03956ea56f0a7a938ae61b2a3.ttf" as="fetch" crossorigin>
  <link rel="preload" href="https://fonts.gstatic.com/s/a/d7ba633bab7f40576e539a7e934a1301d7618dceea59c743de477c2c493462fc.ttf" as="fetch" crossorigin>
  <link rel="preload" href="https://fonts.gstatic.com/s/a/ecdb53099b1a68cd24c6900ea5beeafec81bd3c8cb9d0f3c51b9986583ba3982.ttf" as="fetch" crossorigin>
  <link rel="preload" href="https://fonts.gstatic.com/s/a/fc34426314d00825ccc768a0c4b1178fe704f04bd947882ef10c2b71b7e355e7.ttf" as="fetch" crossorigin>

  <style>
    html, body { margin: 0; height: 100%; background: #0E0E11; }
    #splash {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #0E0E11; transition: opacity 300ms ease-out;
    }
    #splash img { width: 72px; height: 72px; animation: pulse 1.4s ease-in-out infinite; }
    #splash.hidden { opacity: 0; pointer-events: none; }
    @keyframes pulse { 0%, 100% { opacity: .35; transform: scale(.96); } 50% { opacity: 1; transform: scale(1); } }
  </style>
</head>
<body>
  <div id="splash"><img src="favicon.png" alt="Loading"></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('hidden');
      setTimeout(function () { splash.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
