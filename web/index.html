<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by `flutter build web --base-href /sub/path/` when hosting under a sub path. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Denizhan Toprak: C++ gameplay programmer. Unreal Engine plugins, documentation and devlogs.">
  <meta name="theme-color" content="#0E0E11">

  <!-- Link previews (Discord, LinkedIn, X...). These need absolute URLs. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Elmarath">
  <meta property="og:url" content="https://elmarath.com/">
  <meta property="og:title" content="Elmarath · Unreal Engine tools & devlog">
  <meta property="og:description" content="Unreal Engine plugins, documentation and devlogs by Denizhan Toprak.">
  <meta property="og:image" content="https://elmarath.com/assets/assets/images/hero.jpeg">
  <meta name="twitter:card" content="summary_large_image">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Elmarath">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Elmarath · Unreal Engine tools & devlog</title>

  <!-- Google Analytics, the same property as the previous site. Page changes are
       counted automatically (GA4 enhanced measurement). Skipped on localhost.
       Delete this block to turn analytics off. -->
  <script>
    (function () {
      var id = 'G-CRZ373MY93';
      if (/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) return;
      var script = document.createElement('script');
      script.async = true;
      script.src = 'https://www.googletagmanager.com/gtag/js?id=' + id;
      document.head.appendChild(script);
      window.dataLayer = window.dataLayer || [];
      window.gtag = function () { dataLayer.push(arguments); };
      gtag('js', new Date());
      gtag('config', id);
    })();
  </script>
  <link rel="manifest" href="manifest.json">

  <!-- The loading screen takes the colours of the theme picked last time (the
       site saves it as `flutter.theme`), so a bright theme doesn't flash dark. -->
  <script>
    try {
      if (JSON.parse(localStorage.getItem('flutter.theme')) === 'elmarath-gold') {
        document.documentElement.classList.add('bright');
      }
    } catch (e) {}
  </script>
  <style>
    html, body { margin: 0; height: 100%; background: #0E0E11; }
    html.bright, html.bright body { background: #FAF7F2; }
    #splash {
      --bg: #0E0E11; --text: #F5F5F7; --muted: #7D7D86; --accent: #26BBFF; --track: rgba(255, 255, 255, .08);
      position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 28px; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity 300ms ease-out;
    }
    .bright #splash { --bg: #FAF7F2; --text: #1C1712; --muted: #736859; --accent: #A0650A; --track: rgba(58, 42, 16, .12); }
    #splash.hidden { opacity: 0; pointer-events: none; }
    /* A plain copy of the page's text for search engines, written into each
       page at build time (tool/prerender_test.dart). It sits behind the app,
       which covers it. */
    #page-text { position: absolute; inset: 0; z-index: -1; overflow: hidden; padding: 24px; color: #7D7D86; font: 16px/1.5 sans-serif; }
    /* The throbber, after Epic's on unrealengine.com: a faint ring with a
       round-capped arc going round once a second, here around the logo. */
    .throbber { position: relative; width: 112px; height: 112px; display: grid; place-items: center; }
    .throbber svg { position: absolute; inset: 0; animation: spin 1s linear infinite; }
    .throbber circle { fill: none; stroke-width: 3; }
    .throbber .track { stroke: var(--track); }
    .throbber .arc { stroke: var(--accent); stroke-linecap: round; stroke-dasharray: 72 217; }
    .throbber img { width: 64px; height: 64px; animation: breathe 2s ease-in-out infinite; }
    /* As in the nav bar; the negative margin centres it despite the trailing letter space. */
    .wordmark { font-size: 15px; font-weight: 900; letter-spacing: .32em; margin-right: -.32em; }
    .wordmark span { color: var(--accent); }
    /* Like the status line on Unreal Editor's splash screen. */
    #status { height: 1.4em; font-size: 13px; color: var(--muted); letter-spacing: .02em; }
    #status.in { animation: rise 250ms ease-out; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes breathe { 50% { transform: scale(.94); } }
    @keyframes rise { from { opacity: 0; transform: translateY(4px); } }
    @media (prefers-reduced-motion: reduce) {
      .throbber svg { animation-duration: 3s; }
      .throbber img, #status.in { animation: none; }
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="throbber" role="status" aria-label="Loading">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle class="track" cx="50" cy="50" r="46"/>
        <circle class="arc" cx="50" cy="50" r="46"/>
      </svg>
      <img src="icons/Icon-192.png" alt="">
    </div>
    <div class="wordmark">ELMARATH <span>DEV</span></div>
    <div id="status" aria-hidden="true">Compiling shaders…</div>
  </div>
  <script>
    (function () {
      // Each plugin gets a turn while the site loads.
      var lines = [
        'Compiling shaders…', 'Merging skeletal meshes…', 'Tracing hit trails…', 'Queueing abilities…',
        'Sorting the inventory…', 'Staging interactions…', 'Binding inputs…', 'Granting ability sets…',
        'Cooking content…', 'Building lighting…', 'Spawning actors…',
      ];
      var status = document.getElementById('status');
      var next = 0;
      var timer = setInterval(function () {
        status.textContent = lines[++next % lines.length];
        status.classList.remove('in');
        void status.offsetWidth; // restarts the animation
        status.classList.add('in');
      }, 700);

      window.addEventListener('flutter-first-frame', function () {
        clearInterval(timer);
        var splash = document.getElementById('splash');
        if (!splash) return;
        splash.classList.add('hidden');
        setTimeout(function () { splash.remove(); }, 400);
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
