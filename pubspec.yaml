name: elmarath_dev_website
description: "Elmarath Dev - portfolio, blog and Unreal Engine plugin documentation."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  go_router: ^17.0.0
  flutter_markdown_plus: ^1.0.7
  markdown: ^7.3.0
  google_fonts: ^6.3.2
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.3
  yaml: ^3.1.4
  flutter_animate: ^4.5.2
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  font_awesome_flutter: ^10.9.1
  web: ^1.1.1
  animations: ^2.1.0
  pdfrx: ^1.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # test/content_test.dart checks which font files the site asks for.
  http: ^1.6.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/files/
    # >>> content (generated by `dart run tool/content.dart sync`, do not edit)
    - content/
    - content/blog/
    - content/blog/2021-08-26-welcome/
    - content/docs/
    - content/docs/Ability-Queue-Task-System/
    - content/docs/Ability-Queue-Task-System/img/
    - content/docs/Dynamic-Input-System/
    - content/docs/Easy-Ability-Set-System/
    - content/docs/Easy-Ability-Set-System/img/
    - content/docs/Easy-Skeletal-Mesh-Merge-Async/
    - content/docs/Easy-Skeletal-Mesh-Merge-Async/img/
    - content/docs/Easy-Trace-Trail-System/
    - content/docs/Easy-Trace-Trail-System/img/
    - content/docs/Modular-Action-System/
    - content/docs/Modular-Action-System/Actions/
    - content/docs/Modular-Action-System/Decide-Montages/
    - content/docs/Modular-Action-System/img/
    - content/docs/Nested-Inventory-Architecture/
    - content/docs/Nested-Inventory-Architecture/Data-Structure/
    - content/docs/Nested-Inventory-Architecture/Nested-Equipment-Module/
    - content/docs/Nested-Inventory-Architecture/img/
    - content/docs/Staged-Interaction-System/
    - content/docs/Staged-Interaction-System/img/
    - content/docs/img/
    - content/pages/
    # <<< content
