# Netlify: builds the static site in site/ (Astro) from the Markdown in
# content/, and publishes it. It deploys on every push to master.

[build]
  base = "site"
  command = "npm run build"
  publish = "dist"
  # Netlify skips a build when nothing in `base` changed, but the pages come from
  # ../content too: build when either (or this file) changed. Exit 0 = skip.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../content ../netlify.toml"

[build.environment]
  NODE_VERSION = "24"
  ASTRO_TELEMETRY_DISABLED = "1"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Scripts, styles and fonts have their content's hash in the name: cache forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images and videos keep their names when they change: cache for a day, then
# check again in the background.
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
